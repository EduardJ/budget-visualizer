name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  viewer:
    name: Build and test the viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # typecheck, validate the dataset, build dist/ and dist-single/, run the browser tests against both
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: tests/shots/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: single-file-build
          path: dist-single/
          retention-days: 30
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/

  pipeline:
    name: Re-extract the PDF and compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      # the committed raw extractions and data.json must be exactly what the PDF produces
      - run: make PY=python extract data
      - run: git diff --stat --exit-code -- 'datasets/*/raw' 'datasets/*/data.json'
      - run: make PY=python verify

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [viewer, pipeline]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
